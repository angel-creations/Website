name: Clean up old artifacts

on:
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Delete artifacts older than this many days (0 = delete all)'
        required: true
        default: '0'
        type: string
  schedule:
    # Weekly sweep so artifact storage can never balloon again the way it did
    # in October 2026 (~7 GB of hourly dist snapshots blocked production deploys).
    - cron: '17 3 * * 1'

permissions:
  actions: write

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete old workflow artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete artifacts older than the cutoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '3' }}
        run: |
          set -uo pipefail
          case "$MAX_AGE_DAYS" in ''|*[!0-9]*) echo "max_age_days must be a non-negative integer" >&2; exit 1;; esac
          echo "Deleting artifacts older than $MAX_AGE_DAYS day(s) in $GITHUB_REPOSITORY"
          total=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=1" --jq '.total_count')
          echo "Artifacts before: $total"
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select((now - (.created_at | fromdateiso8601)) > ($MAX_AGE_DAYS * 86400)) | .id")
          deleted=0; failed=0
          for id in $ids; do
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null 2>&1; then
              deleted=$((deleted+1))
            else
              failed=$((failed+1))
              echo "Could not delete artifact $id (skipping)"
            fi
          done
          remaining=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=1" --jq '.total_count')
          echo "Deleted: $deleted | Failed: $failed | Remaining: $remaining"
          echo "::notice title=Artifact cleanup::Deleted $deleted artifact(s); $remaining remain. GitHub recalculates storage usage within 6-12 hours."
