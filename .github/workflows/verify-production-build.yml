name: Verify production build

on:
  # Build and verify every branch so versions are tested before merging to main.
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # A host or a stray deployment can replace the published directory minutes after a
  # successful deploy (this is how the site went blank with the repository source tree
  # published at the document root). Rebuild, re-upload and re-verify on a schedule so
  # the published site heals itself instead of waiting for someone to notice.
  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and build production site
        run: npm run build

      - name: Verify generated routes and local assets
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const requiredRoutes = [
            '/', '/about/', '/contact/', '/works/', '/metaverse/',
            '/animation/', '/augment-reality/',
            '/brand-advertisement/', '/media-production/',
            '/mixed-reality/', '/virtual-reality/',
            '/privacy-policy/', '/terms-of-service/',
            '/capabilities/brand/', '/capabilities/design/',
            '/capabilities/content/', '/capabilities/animation-3d/',
            '/capabilities/digital/', '/capabilities/experiences/',
            '/capabilities/creative-technology/', '/capabilities/film/'
          ];

          const missingRoutes = requiredRoutes.filter((route) => {
            const file = route === '/' ? 'dist/index.html' : join('dist', route.slice(1), 'index.html');
            return !existsSync(file);
          });
          const missingStatusDocuments = ['/404.html', '/410.html']
            .filter((path) => !existsSync(join('dist', path.slice(1))));
          const sitemap = readFileSync('dist/sitemap.xml', 'utf8');
          const retiredRouteListed = sitemap.includes('https://angelcreations.in/360-video/');

          const html = readFileSync('index.html', 'utf8');
          const stylesheetPaths = [...html.matchAll(/<link[^>]+href="(\/assets\/[^"]+\.css)"/g)]
            .map((match) => match[1]);
          const missingStylesheets = stylesheetPaths.filter((url) =>
            !existsSync(join('dist', url.slice(1)))
          );

          const slides = JSON.parse(readFileSync('src/data/slideExperiences.json', 'utf8'));
          const mediaPaths = slides.flatMap((slide) => [slide.video, slide.poster])
            .filter((url) => typeof url === 'string' && url.startsWith('/'));
          const missingMedia = [...new Set(mediaPaths)].filter((url) =>
            !existsSync(join('dist', url.slice(1)))
          );

          for (const [label, items] of [
            ['Generated route files', missingRoutes],
            ['Error status documents', missingStatusDocuments],
            ['Retired route absent from sitemap', retiredRouteListed ? ['/360-video/'] : []],
            ['Local stylesheets', missingStylesheets],
            ['Local slide media/posters', missingMedia],
          ]) {
            if (items.length) {
              console.error(label + ' missing:');
              for (const item of items) console.error(' - ' + item);
              process.exitCode = 1;
            }
          }

          if (!process.exitCode) {
            console.log('Verified ' + requiredRoutes.length + ' routes, branded 404/410 documents, retired-route sitemap exclusion, ' +
              stylesheetPaths.length + ' stylesheet links and ' +
              mediaPaths.length + ' local slide media/poster references.');
          }
          NODE

      - name: Rehearse the deployable site on a static host
        run: |
          npx playwright install --with-deps chromium
          node scripts/playwright-smoke.mjs --static
          node scripts/checkBootFallback.mjs
          node scripts/checkDegradedBoot.mjs

      - name: Upload static-host screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-static-report
          path: .playwright-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload deployable static site
        uses: actions/upload-artifact@v4
        with:
          name: angel-creations-dist
          path: dist/
          if-no-files-found: error
          # .htaccess is part of the site: it keeps HTML uncached and hides source paths.
          # upload-artifact omits dotfiles unless asked, and dropping it silently disabled
          # the cache policy in production.
          include-hidden-files: true
          retention-days: 14


  hostinger-connection-preflight:
    name: Hostinger SSH preflight (no deployment)
    # Run manually from this branch to verify credentials and server access only.
    # This job must never upload, delete, back up, or alter website files.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify required settings and SSH access
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          HOSTINGER_DOCUMENT_ROOT: ${{ vars.HOSTINGER_DOCUMENT_ROOT }}
        run: |
          set -Eeuo pipefail
          : "${HOSTINGER_HOST:?Missing HOSTINGER_HOST secret}"
          : "${HOSTINGER_PORT:?Missing HOSTINGER_PORT secret}"
          : "${HOSTINGER_USERNAME:?Missing HOSTINGER_USERNAME secret}"
          : "${HOSTINGER_SSH_PRIVATE_KEY:?Missing HOSTINGER_SSH_PRIVATE_KEY secret}"
          : "${HOSTINGER_KNOWN_HOSTS:?Missing HOSTINGER_KNOWN_HOSTS secret}"
          : "${HOSTINGER_DOCUMENT_ROOT:?Missing HOSTINGER_DOCUMENT_ROOT variable}"

          DOCROOT="$HOSTINGER_DOCUMENT_ROOT"
          if [[ "$DOCROOT" != /*/public_html || "$DOCROOT" == *"/../"* || "$DOCROOT" == *"/.." || "$DOCROOT" == *" "* ]]; then
            echo "Refusing preflight: document root must be an absolute verified path ending in /public_html."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - >/dev/null

          TARGET="$HOSTINGER_USERNAME@$HOSTINGER_HOST"
          ssh -p "$HOSTINGER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" "$TARGET" bash -s -- "$DOCROOT" <<'REMOTE'
          set -Eeuo pipefail
          DOCROOT="$1"
          test -d "$DOCROOT" || { echo "Document root does not exist" >&2; exit 1; }
          test -s "$DOCROOT/index.html" || { echo "Existing homepage not found" >&2; exit 1; }
          test -w "$DOCROOT" || { echo "Document root is not writable" >&2; exit 1; }
          test -w "$HOME" || { echo "Home directory is not writable" >&2; exit 1; }
          command -v tar >/dev/null || { echo "tar unavailable" >&2; exit 1; }
          command -v rsync >/dev/null || { echo "rsync unavailable" >&2; exit 1; }
          printf 'SSH authentication passed.\nDocument root exists and is writable.\nrsync and tar are available.\n'
          printf 'No website files were changed.\n'
          REMOTE

  live-site-diagnostics:
    name: Live site diagnostics (read-only)
    # Reports what the public site is actually serving, as GitHub runners see it.
    # Read-only: fetches public URLs and never changes any file or deployment.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Inspect the public site over HTTPS
        shell: bash
        run: |
          set -uo pipefail
          SITE_URL="${{ vars.SITE_URL || 'https://angelcreations.in' }}"
          echo "Target: $SITE_URL"

          probe() {
            local path="$1"
            local body; body="$(mktemp)"
            local meta
            meta="$(curl -sSL -o "$body" -w '%{http_code} %{content_type} %{size_download} %{time_total}' --max-time 45 "$SITE_URL$path" || echo 'curl-error - - -')"
            local code="${meta%% *}"
            local root='no'; grep -q 'id="root"' "$body" 2>/dev/null && root='yes'
            local closed='no'; grep -Eq '<script[^>]*type="module"[^>]*></script>' "$body" 2>/dev/null && closed='yes'
            local entry; entry="$(grep -o -m1 'src="[^"]*/assets/[^"]*\.js"' "$body" 2>/dev/null | cut -d'"' -f2 || true)"
            printf '%s => %s | root=%s closed-script=%s | entry=%s\n' "$path" "$meta" "$root" "$closed" "${entry:-none}"
          }

          {
            for path in / /index.html /about/ /about/index.html /works/ /contact/ /metaverse/ /404.html /robots.txt /sitemap.xml; do
              probe "$path"
            done

            # Entry bundle the live homepage actually points at.
            HOME_BODY="$(mktemp)"
            curl -sSL --max-time 45 "$SITE_URL/" -o "$HOME_BODY" || true
            ENTRY="$(grep -o -m1 'src="/assets/[^"]*\.js"' "$HOME_BODY" | cut -d'"' -f2 || true)"
            if [ -n "$ENTRY" ]; then
              probe "$ENTRY"
              probe "/assets/"
            fi

            # A representative archive asset, to separate "documents missing" from "whole tree missing".
            probe "/media/images/generated-home-posters/metaverse.jpg"
          } | tee /tmp/live-diagnostics.txt

          # Surface the same findings as annotations, which remain readable without
          # downloading job logs or artifacts.
          echo "::group::Live diagnostics"
          while IFS= read -r line; do
            echo "::warning title=Live site::${line//::/:}"
          done < /tmp/live-diagnostics.txt
          echo "::endgroup::"

          echo "Diagnostics complete. No files were changed."

  hostinger-inspect:
    name: Hostinger document root inspection (read-only)
    # Answers "what is actually being served?" without changing anything: prints the
    # remote paths and the first bytes of the live homepage document.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Describe the served document root
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          HOSTINGER_DOCUMENT_ROOT: ${{ vars.HOSTINGER_DOCUMENT_ROOT }}
        run: |
          set -uo pipefail
          echo "::warning title=Deploy config::HOSTINGER_DOCUMENT_ROOT=${HOSTINGER_DOCUMENT_ROOT:-<unset>}"
          echo "::warning title=Deploy config::HOSTINGER_HOST=${HOSTINGER_HOST:+set}"

          if [ -z "${HOSTINGER_SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning title=Inspection::No SSH credentials available; skipping."
            exit 0
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - >/dev/null

          ssh -p "$HOSTINGER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" bash -s -- "${HOSTINGER_DOCUMENT_ROOT:-}" <<'REMOTE' > /tmp/inspection.txt 2>&1
          set -uo pipefail
          DOCROOT="$1"
          echo "remote home: $HOME"
          echo "configured document root: ${DOCROOT:-<unset>}"
          echo "--- candidate document roots"
          for candidate in "$HOME/public_html" "$HOME/domains"/*/public_html; do
            [ -d "$candidate" ] || continue
            echo "== $candidate"
            ls -la "$candidate" 2>/dev/null | head -n 20
            if [ -f "$candidate/index.html" ]; then
              echo "-- bytes: $(wc -c < "$candidate/index.html")"
              echo "-- first 12 lines:"
              head -n 12 "$candidate/index.html"
            fi
            if [ -d "$candidate/about" ]; then echo "-- about/ exists"; else echo "-- about/ missing"; fi
            if [ -d "$candidate/assets" ]; then echo "-- assets/ exists"; else echo "-- assets/ missing"; fi
          done
          if [ -n "$DOCROOT" ] && [ -d "$DOCROOT" ]; then
            echo "--- configured root listing"
            ls -la "$DOCROOT" 2>/dev/null | head -n 25
            [ -f "$DOCROOT/index.html" ] && echo "-- configured index.html bytes: $(wc -c < "$DOCROOT/index.html")"
          fi
          echo "--- git deploy markers"
          ls -la "$HOME" 2>/dev/null | head -n 20
          REMOTE

          # Keep annotations small: emit the most telling lines only.
          grep -E 'remote home|configured|^==|index.html|main.tsx|about/|assets/|bytes:' /tmp/inspection.txt | head -n 40 | while IFS= read -r line; do
            clean="${line//::/:}"
            echo "::warning title=Server::${clean:0:180}"
          done
          echo "Inspection finished. No files were changed."

  deploy-to-hostinger:
    name: Deploy verified build to Hostinger
    needs: build-and-verify
    # Production deployment remains disabled until the verified document root,
    # SSH credentials, host key, and rollback procedure are configured.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && vars.HOSTINGER_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    steps:
      - name: Download verified static build
        uses: actions/download-artifact@v4
        with:
          name: angel-creations-dist
          path: dist

      - name: Back up and deploy dist over SSH
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          HOSTINGER_DOCUMENT_ROOT: ${{ vars.HOSTINGER_DOCUMENT_ROOT }}
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error title=Deploy failed at line $LINENO::$BASH_COMMAND (exit $rc)"' ERR

          : "${HOSTINGER_HOST:?Add the HOSTINGER_HOST Actions secret}"
          : "${HOSTINGER_PORT:?Add the HOSTINGER_PORT Actions secret}"
          : "${HOSTINGER_USERNAME:?Add the HOSTINGER_USERNAME Actions secret}"
          : "${HOSTINGER_SSH_PRIVATE_KEY:?Add the HOSTINGER_SSH_PRIVATE_KEY Actions secret}"
          : "${HOSTINGER_KNOWN_HOSTS:?Add verified HOSTINGER_KNOWN_HOSTS to Actions secrets}"
          : "${HOSTINGER_DOCUMENT_ROOT:?Set HOSTINGER_DOCUMENT_ROOT only after verifying the live document root}"

          DOCROOT="$HOSTINGER_DOCUMENT_ROOT"
          if [[ "$DOCROOT" != /*/public_html || "$DOCROOT" == *"/../"* || "$DOCROOT" == *"/.." || "$DOCROOT" == *" "* ]]; then
            echo "Refusing deployment: HOSTINGER_DOCUMENT_ROOT must be a verified absolute path ending in /public_html, without traversal or spaces."
            exit 1
          fi
          test -s dist/index.html
          test -d dist/assets
          if [ ! -f dist/.htaccess ]; then
            echo "::error title=Incomplete build artifact::dist/.htaccess is missing, so the HTML cache policy cannot be published. Ensure the artifact upload includes hidden files."
            exit 1
          fi
          if ! grep -Eq 'src="[^"]*/assets/[^"]+\.js"' dist/index.html; then
            echo "Refusing deployment: dist/index.html does not reference a compiled JavaScript asset."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - >/dev/null

          TARGET="$HOSTINGER_USERNAME@$HOSTINGER_HOST"
          SSH=(ssh -p "$HOSTINGER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts")
          RSYNC_RSH="ssh -p $HOSTINGER_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          # Back up the complete current document root outside public_html before touching it.
          if ! BACKUP_PATH="$("${SSH[@]}" "$TARGET" bash -s -- "$DOCROOT" 2>/tmp/backup.err <<'REMOTE'
          set -Eeuo pipefail
          DOCROOT="$1"
          test -d "$DOCROOT" || { echo "Document root does not exist" >&2; exit 1; }
          test -s "$DOCROOT/index.html" || { echo "Expected existing index.html; refusing first deployment until the target is verified" >&2; exit 1; }
          test -w "$DOCROOT" || { echo "Document root is not writable" >&2; exit 1; }
          test -w "$HOME" || { echo "Home directory is not writable for backups" >&2; exit 1; }
          command -v tar >/dev/null || { echo "tar is unavailable; refusing deployment" >&2; exit 1; }
          command -v rsync >/dev/null || { echo "rsync is unavailable; refusing deployment because safe deployment and rollback require it" >&2; exit 1; }
          BACKUP_DIR="$HOME/angel-creations-deploy-backups"
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          BACKUP_PATH="$BACKUP_DIR/public_html-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
          tar -czf "$BACKUP_PATH" -C "$DOCROOT" .
          test -s "$BACKUP_PATH"
          tar -tzf "$BACKUP_PATH" >/dev/null
          printf '%s\n' "$BACKUP_PATH"
          REMOTE
          )"
          then
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line="${line//::/:}"
              echo "::error title=Pre-deployment backup failed::${line:0:180}"
            done < /tmp/backup.err
            echo "SSH target: $TARGET  document root: $DOCROOT" >&2
            exit 1
          fi
          echo "Created a pre-deployment backup on the Hostinger account."
          echo "::notice title=Deploy stage::Pre-deployment backup created"

          rollback() {
            echo "Deployment failed; attempting to restore the pre-deployment backup."
            "${SSH[@]}" "$TARGET" bash -s -- "$DOCROOT" "$BACKUP_PATH" <<'REMOTE'
          set -Eeuo pipefail
          DOCROOT="$1"
          BACKUP_PATH="$2"
          RESTORE_DIR="$(mktemp -d "$HOME/angel-creations-restore.XXXXXX")"
          trap 'rm -rf "$RESTORE_DIR"' EXIT
          tar -xzf "$BACKUP_PATH" -C "$RESTORE_DIR"
          rsync -a --delete "$RESTORE_DIR/" "$DOCROOT/"
          REMOTE
          echo "Rollback completed from the saved backup."
          }

          # Surface a failure reason as an annotation: job logs are not always readable
          # from automation, and "the deploy failed" alone does not explain a blank site.
          annotate() {
            local title="$1"; shift
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line="${line//::/:}"
              echo "::error title=${title}::${line:0:180}"
            done
          }

          if ! rsync -az --delay-updates \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            -e "$RSYNC_RSH" dist/ "$TARGET:$DOCROOT/" 2>/tmp/rsync.err; then
            annotate 'Deploy rsync failed' < /tmp/rsync.err
            rollback || { echo "CRITICAL: automatic rollback failed; restore the backup manually: $BACKUP_PATH"; exit 1; }
            exit 1
          fi
          echo "Uploaded dist/ to the document root."
          echo "::notice title=Deploy stage::dist/ uploaded"

          # .htaccess is uploaded only when the server has none, or when it is the file this
          # workflow manages. A hand-written Apache configuration is never replaced.
          # It matters: without no-cache HTML, a cached document can point at a bundle a
          # later deploy replaced, and the browser renders a blank page.
          HTACCESS_STATE="$("${SSH[@]}" "$TARGET" bash -s -- "$DOCROOT" <<'REMOTE'
          set -uo pipefail
          DOCROOT="$1"
          if [ ! -f "$DOCROOT/.htaccess" ]; then
            echo missing
          elif grep -q 'angel-creations-htaccess:' "$DOCROOT/.htaccess"; then
            echo managed
          else
            echo unmanaged
          fi
          REMOTE
          )"
          echo "Server .htaccess state: ${HTACCESS_STATE:-unknown}"

          case "$HTACCESS_STATE" in
            missing|managed)
              if ! rsync -az --delay-updates -e "$RSYNC_RSH" dist/.htaccess "$TARGET:$DOCROOT/.htaccess"; then
                annotate 'Apache policy upload failed' <<< 'dist/.htaccess could not be copied'
              else
                echo "::notice title=Deploy stage::.htaccess policy applied"
              fi
              ;;
            *)
              echo "::warning title=Apache policy not applied::The server has a hand-written .htaccess; add no-cache HTML headers manually if HTML is cacheable"
              ;;
          esac

          # A leftover WordPress index.php wins the directory index on this host and
          # serves a fatal error (HTTP 500 -> blank page) instead of index.html.
          if ! "${SSH[@]}" "$TARGET" bash -s -- "$DOCROOT" <<'REMOTE' 2>/tmp/quarantine.err
          set -Eeuo pipefail
          DOCROOT="$1"
          if [ -f "$DOCROOT/index.php" ]; then
            QUARANTINE_DIR="$HOME/angel-creations-deploy-backups"
            mkdir -p "$QUARANTINE_DIR"
            chmod 700 "$QUARANTINE_DIR"
            QUARANTINE="$QUARANTINE_DIR/index.php.$(date -u +%Y%m%dT%H%M%SZ)"
            mv "$DOCROOT/index.php" "$QUARANTINE"
            echo "Moved the conflicting document-root index.php to $QUARANTINE so index.html is served."
          fi
          REMOTE
          then
            annotate 'index.php quarantine failed' < /tmp/quarantine.err
            rollback || { echo "CRITICAL: automatic rollback failed; restore the backup manually: $BACKUP_PATH"; exit 1; }
            exit 1
          fi

          if ! "${SSH[@]}" "$TARGET" bash -s -- "$DOCROOT" <<'REMOTE'
          set -Eeuo pipefail
          DOCROOT="$1"
          test -s "$DOCROOT/index.html"
          test -d "$DOCROOT/assets"
          grep -Eq 'src="[^"]*/assets/[^"]+\.js"' "$DOCROOT/index.html"
          # The entry script must be closed. An unterminated <script> makes browsers
          # swallow the rest of the document and render a blank page.
          grep -Eq '<script[^>]*type="module"[^>]*></script>' "$DOCROOT/index.html"
          grep -q 'id="root"' "$DOCROOT/index.html"
          for document in about works contact metaverse animation mixed-reality virtual-reality augment-reality brand-advertisement media-production; do
            test -s "$DOCROOT/$document/index.html" || { echo "Missing route document: $document" >&2; exit 1; }
            grep -q 'id="root"' "$DOCROOT/$document/index.html"
            grep -Eq '<script[^>]*type="module"[^>]*></script>' "$DOCROOT/$document/index.html"
          done
          ENTRY="$(grep -o -m1 'src="/assets/[^"]*\.js"' "$DOCROOT/index.html" | cut -d'"' -f2)"
          test -n "$ENTRY"
          test -s "$DOCROOT$ENTRY"
          REMOTE
          then
            annotate 'Remote output verification failed'
            rollback || { echo "CRITICAL: automatic rollback failed; restore the backup manually: $BACKUP_PATH"; exit 1; }
            exit 1
          fi

          # Verify what the public internet actually receives, not just the files on disk.
          # Hosts commonly serve a cached copy of the previous document for a short
          # window after an upload, so retry before declaring failure.
          SITE_URL="${{ vars.SITE_URL || 'https://angelcreations.in' }}"
          verify_live() {
            local attempt route code page entry
            for attempt in 1 2 3 4 5 6; do
              local failures=""
              for route in / /about/ /works/ /contact/; do
                page="$(mktemp)"
                code="$(curl -sSL -o "$page" -w '%{http_code}' --max-time 30 "$SITE_URL$route" || echo 000)"
                if [ "$code" != "200" ]; then
                  failures="${failures}${route}=${code} "
                  continue
                fi
                if ! grep -q 'id="root"' "$page"; then
                  if grep -q '/src/main.tsx' "$page"; then
                    failures="${failures}${route}=source-index.html "
                  else
                    failures="${failures}${route}=no-#root "
                  fi
                elif ! grep -Eq '<script[^>]*type="module"[^>]*></script>' "$page"; then
                  failures="${failures}${route}=unclosed-script "
                fi
                if [ "$route" = "/" ]; then
                  entry="$(grep -o -m1 'src="[^"]*/assets/[^"]*\.js"' "$page" | cut -d'"' -f2 || true)"
                  if [ -z "$entry" ]; then
                    failures="${failures}${route}=no-bundle "
                  else
                    local entry_code
                    entry_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL$entry" || echo 000)"
                    [ "$entry_code" = "200" ] || failures="${failures}${entry}=${entry_code} "
                  fi
                  # The published root must be the built site, never a checkout of this
                  # repository: a raw index.html points at /src/main.tsx, nothing runs and
                  # the visitor gets a blank page.
                  local probe probe_code
                  for probe in /package.json /src/main.tsx /vite.config.ts /scripts; do
                    probe_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL$probe" || echo 000)"
                    # /scripts and /package.json must be refused. /src/main.tsx must not be
                    # readable either: 404 is correct, any 2xx means the tree is exposed.
                    if [ "$probe_code" != "404" ] && [ "$probe_code" != "403" ] && [ "$probe_code" != "410" ]; then
                      failures="${failures}${probe}=${probe_code}(source-published) "
                    fi
                  done
                  local robots_code
                  robots_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/robots.txt" || echo 000)"
                  [ "$robots_code" = "200" ] || failures="${failures}/robots.txt=${robots_code} "
                fi
              done

              if [ -z "$failures" ]; then
                local cache_header
                cache_header="$(curl -sSI --max-time 30 "$SITE_URL/" | tr -d '\r' | grep -i '^cache-control:' | head -n1 || true)"
                if echo "$cache_header" | grep -qi 'no-cache\|no-store\|max-age=0'; then
                  echo "::notice title=Live site verified::/ , /about/ , /works/ and /contact/ serve mountable documents with a loadable bundle; HTML is not cacheable"
                else
                  echo "::warning title=HTML cache policy::homepage Cache-Control is '${cache_header:-absent}'; a cached document can outlive its bundle. Add the managed .htaccess or purge the host cache."
                fi
                return 0
              fi
              echo "::warning title=Live check attempt $attempt::${failures}"
              sleep 15
            done

            echo "::error title=Live site verification failed::${failures}"
            echo "The files were uploaded; the public site is not serving them. Check the document root mapping, a stale .htaccess, or another deployment resetting the directory. Backup: $BACKUP_PATH" >&2
            return 1
          }

          if ! verify_live; then
            # Most failures here mean the directory was rewritten between the upload and the
            # check (a host-side git deployment is the common cause). Uploading again is the
            # repair; rolling back would restore the broken tree, so try once more first.
            echo "::warning title=Re-uploading::the published directory did not match the build, uploading again"
            rsync -az --delay-updates --exclude='.htaccess' --exclude='.well-known/' \
              -e "$RSYNC_RSH" dist/ "$TARGET:$DOCROOT/" || true
            rsync -az --delay-updates -e "$RSYNC_RSH" dist/.htaccess "$TARGET:$DOCROOT/.htaccess" || true
            if ! verify_live; then
              rollback || { echo "CRITICAL: automatic rollback failed; restore the backup manually: $BACKUP_PATH"; exit 1; }
              exit 1
            fi
            echo "::notice title=Deploy repaired::the second upload served the verified build"
          fi

          echo "Hostinger files verified. Backup retained at: $BACKUP_PATH"
